            <nav>

    <main class="container">
        <!-- 核心要求：H1 大標題（粗體、大） -->
        <h1>歡迎來到我們的網站</h1>
        <p style="text-align: center;">這是一個符合你所有要求的基礎 HTML 架構。它是白底黑字，並完全依靠粗體和字體大小來區分內容層級。</p>

        <!-- 核心要求：H2 次標題（粗體、中大） -->
        <h2>精選內容</h2>

        <!-- 核心要求：四個圖片解說空位 (網格佈局) -->
        <div class="explain-grid">
            
            <!-- 空位 1 -->
            <div class="explain-item">
                <div class="image-placeholder"></div>
                <h3>解目標標題 1</h3>
                <p>這是第一個圖片的解說文字。這裡是正常的內文字體大小，沒有加粗。</p>
            </div>

            <!-- 空位 2 -->
            <div class="explain-item">
                <div class="image-placeholder"></div>
                <h3>解目標標題 2</h3>
                <p>這是第二個圖片的解說文字。這裡是正常的內文字體大小，沒有加粗。</p>
            </div>

            <!-- 空位 3 -->
            <div class="explain-item">

                <p>這是第三個圖片的解說文字。這裡是正常的內文字體大小，沒有加粗。</p>

            <!-- 空位 4 -->

                <p>這是第四個圖片的解說文字。這裡是正常的內文字體大小，沒有加粗。</p>
            </div>

        </div> <!-- end .explain-grid -->
